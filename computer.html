<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kola the Computer 💻⚡ | Elvion AI</title>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

<!-- Magic Libraries for Frontend Processing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
/* =====================================================================
   KOLA THE COMPUTER — SUPERCOMPUTER GOLD & DARK THEME
   ===================================================================== */
:root {
  --font-brand: 'Playfair Display', serif;
  --font-body: 'JetBrains Mono', monospace; /* Computer Vibe */
  --font-reading: 'Times New Roman', serif;
  
  --bg-base: #030303;
  --bg-surface: #0a0a0a;
  --bg-panel: #121212;
  --bg-input: #0f0f0f;
  
  --border: rgba(255, 215, 0, 0.15);
  --border-focus: rgba(255, 215, 0, 0.4);
  
  --text-1: #f4f4f4;
  --text-2: #a0a0a0;
  --text-muted: #555555;
  
  --accent: #ffd700; /* Pure Gold */
  --accent-2: #c9a96e; /* Muted Gold */
  --accent-green: #00ffcc; /* Cyber Green/Cyan */
  --danger: #ff3366;
  
  --user-bubble: rgba(255, 215, 0, 0.05);
  --user-border: rgba(255, 215, 0, 0.2);
  
  --shadow: 0 8px 40px rgba(0,0,0,0.9);
  --glow: 0 0 15px rgba(255, 215, 0, 0.2);
  
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-base); color: var(--text-1); font-family: var(--font-body); }

/* ── LAYOUT ───────────────────────────────────────────────────────── */
#app {
  display: flex; flex-direction: column; height: 100vh; max-width: 1400px; margin: 0 auto;
  border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--bg-surface);
  box-shadow: var(--glow); position: relative;
}

/* ── HEADER & WALLET ──────────────────────────────────────────────── */
header {
  display: flex; justify-content: space-between; align-items: center; padding: 15px 25px;
  background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); z-index: 100;
}
.brand { display: flex; flex-direction: column; align-items: flex-start; }
.brand h1 { font-family: var(--font-brand); font-size: 1.4rem; color: var(--accent); letter-spacing: 2px; font-weight: 900; text-transform: uppercase; text-shadow: 0 0 10px rgba(255,215,0,0.3); }
.brand span { font-size: 0.65rem; color: var(--accent-green); letter-spacing: 4px; text-transform: uppercase; }

.wallet-badge {
  display: flex; align-items: center; gap: 8px; padding: 6px 14px;
  background: rgba(255, 215, 0, 0.05); border: 1px solid var(--border); border-radius: 20px;
  font-size: 0.85rem; font-weight: 700; color: var(--accent); cursor: pointer; transition: var(--transition);
}
.wallet-badge:hover { background: rgba(255, 215, 0, 0.15); box-shadow: var(--glow); }

/* ── CHAT VIEWPORT ────────────────────────────────────────────────── */
#chat-vp {
  flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 25px;
  scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--accent-2) transparent;
}
#chat-vp::-webkit-scrollbar { width: 4px; }
#chat-vp::-webkit-scrollbar-thumb { background: var(--border); }

.msg-group { display: flex; flex-direction: column; gap: 8px; max-width: 85%; animation: fadeUp 0.4s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.msg-group.usr { align-self: flex-end; align-items: flex-end; }
.msg-group.ai { align-self: flex-start; }

.bubble { font-size: 0.95rem; line-height: 1.7; word-break: break-word; }
.msg-group.usr .bubble {
  background: var(--user-bubble); border: 1px solid var(--user-border);
  padding: 12px 18px; border-radius: 12px 12px 0 12px; font-family: var(--font-reading); font-size: 1.05rem;
}
.msg-group.ai .bubble { font-family: var(--font-reading); font-size: 1.1rem; color: #ddd; }

/* ── THINKING BLOCK (PERSISTENT & GLOWING) ────────────────────────── */
.think-block {
  margin: 10px 0; border: 1px solid rgba(255, 215, 0, 0.3); border-radius: var(--radius-md);
  background: rgba(10, 10, 10, 0.8); overflow: hidden; box-shadow: 0 0 10px rgba(255, 215, 0, 0.05);
}
.think-toggle {
  display: flex; align-items: center; gap: 8px; padding: 10px 15px; cursor: pointer;
  font-size: 0.8rem; color: var(--accent); font-family: var(--font-body); text-transform: uppercase; letter-spacing: 1px;
}
.think-toggle::-webkit-details-marker { display: none; }
.think-content { padding: 12px 15px; font-size: 0.9rem; color: var(--text-2); border-top: 1px dashed rgba(255, 215, 0, 0.2); font-family: var(--font-body); white-space: pre-wrap; }
.think-content i { color: var(--accent-green); font-style: normal; }

/* ── MAGIC COMMAND CARDS ──────────────────────────────────────────── */
.magic-card {
  display: flex; align-items: center; justify-content: space-between; gap: 15px;
  padding: 15px; margin: 15px 0; background: linear-gradient(145deg, #111, #1a1a1a);
  border: 1px solid var(--accent-2); border-radius: var(--radius-md); box-shadow: var(--glow);
}
.magic-card-info { display: flex; align-items: center; gap: 15px; }
.magic-icon { font-size: 2rem; color: var(--accent); }
.magic-title { font-family: var(--font-brand); font-size: 1.1rem; color: #fff; font-weight: 700; }
.magic-sub { font-size: 0.75rem; color: var(--text-2); font-family: var(--font-body); }
.magic-btn {
  background: var(--accent); color: #000; border: none; padding: 8px 16px; border-radius: 20px;
  font-family: var(--font-body); font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: 0.3s;
}
.magic-btn:hover { background: #fff; transform: scale(1.05); }

/* ── INPUT DOCK ───────────────────────────────────────────────────── */
#dock { padding: 20px; background: rgba(5,5,5,0.9); border-top: 1px solid var(--border); flex-shrink: 0; }
.capsule {
  display: flex; flex-direction: column; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 10px 15px; transition: var(--transition);
}
.capsule:focus-within { border-color: var(--accent); box-shadow: 0 0 15px rgba(255,215,0,0.1); }
textarea {
  width: 100%; background: transparent; border: none; color: #fff; font-size: 1rem;
  resize: none; outline: none; min-height: 45px; max-height: 200px; font-family: var(--font-reading);
}
textarea::placeholder { color: var(--text-muted); font-family: var(--font-body); font-size: 0.85rem; }
.dock-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.icon-btn {
  background: transparent; border: none; color: var(--text-2); font-size: 1.1rem;
  cursor: pointer; transition: 0.3s; padding: 5px;
}
.icon-btn:hover { color: var(--accent); }
.send-btn {
  background: var(--accent); color: #000; border: none; width: 40px; height: 40px;
  border-radius: 50%; font-size: 1.1rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;
}
.send-btn:hover { transform: translateY(-2px); box-shadow: var(--glow); }

/* ── FILE PREVIEW ─────────────────────────────────────────────────── */
#file-bar { display: none; gap: 10px; padding-bottom: 10px; flex-wrap: wrap; }
.file-pill {
  background: rgba(255,215,0,0.1); border: 1px solid var(--accent-2); color: var(--accent);
  padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; display: flex; align-items: center; gap: 8px;
}
.file-pill button { background: none; border: none; color: var(--danger); cursor: pointer; }

/* ── MEDIA/IMAGE RENDERS ──────────────────────────────────────────── */
.ai-media { max-width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border); margin-top: 10px; box-shadow: var(--glow); }

</style>
</head>
<body>

<div id="app">
  <!-- HEADER -->
  <header>
    <div class="brand">
      <h1>Kola The Computer</h1>
      <span>Autonomous M3 Execution Engine ⚡</span>
    </div>
    <div class="wallet-badge" onclick="fundWallet()">
      <i class="fa-solid fa-coins"></i> <span id="wallet-bal">--</span>
    </div>
  </header>

  <!-- CHAT -->
  <div id="chat-vp">
    <div class="msg-group ai">
      <div class="bubble">
        <p style="color:var(--accent); font-family:var(--font-body); font-size:0.85rem; margin-bottom:10px;">
          > SYSTEM BOOT COMPLETE<br>
          > ENGINE: MINIMAX-M3 (PHILADELPHIA)<br>
          > CAPABILITIES: DOCX/PDF SYNTHESIS, MEDIA GENERATION, FILE EXTRACTION.
        </p>
        <p>I am Kola. Drop a document to rewrite, an article to generate images for, or just tell me what to build.</p>
      </div>
    </div>
  </div>

  <!-- DOCK -->
  <div id="dock">
    <div id="file-bar"></div>
    <div class="capsule">
      <textarea id="prompt-input" placeholder="Initialize command... (e.g., 'Rewrite this text to Times New Roman and make it a DOCX')" rows="1"></textarea>
      <div class="dock-actions">
        <div style="display:flex; gap:10px;">
          <button class="icon-btn" onclick="document.getElementById('file-upload').click()"><i class="fa-solid fa-paperclip"></i></button>
          <input type="file" id="file-upload" multiple style="display:none" onchange="handleFiles(this.files)">
          <button class="icon-btn" title="System Memory" onclick="editMemory()"><i class="fa-solid fa-brain"></i></button>
        </div>
        <button class="send-btn" id="send-btn" onclick="sendMessage()"><i class="fa-solid fa-bolt"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

  // --- FIREBASE SETUP ---
  const fbApp = initializeApp({
    apiKey: "AIzaSyAyROm0aBGjry6NUfhNM3e0qwPcCDoIqSk",
    authDomain: "elvionai.firebaseapp.com",
    projectId: "elvionai",
    storageBucket: "elvionai.appspot.com",
    messagingSenderId: "161078300830",
    appId: "1:161078300830:web:f460df8591704eb0e96b8f"
  });
  const auth = getAuth(fbApp);
  const API_URL = "https://web-production-9a18.up.railway.app";
  
  let currentUser = null;
  let chatHistory = [];
  let attachedFiles = [];
  let extractedFileContext = "";
  let userMemory = localStorage.getItem("kola_memory") || "";

  // --- PDF.js Setup ---
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  // --- AUTH & WALLET ---
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'signup-login.html'; return; }
    currentUser = user;
    updateWallet();
  });

  async function updateWallet() {
    try {
      const token = await currentUser.getIdToken();
      const res = await fetch(`${API_URL}/api/user/keys-and-balance`, { headers: { "X-Firebase-Token": token }});
      if (res.ok) {
        const d = await res.json();
        document.getElementById('wallet-bal').textContent = d.balance;
      }
    } catch(e) {}
  }
  
  window.fundWallet = () => {
    alert("Redirecting to Elvion AI Dashboard for funding.");
    window.location.href = "profile.html";
  };

  window.editMemory = () => {
    const mem = prompt("Set Kola's persistent memory/context:", userMemory);
    if (mem !== null) {
      userMemory = mem;
      localStorage.setItem("kola_memory", mem);
    }
  };

  // --- FILE HANDLING (CLIENT-SIDE EXTRACTION) ---
  window.handleFiles = async (files) => {
    const bar = document.getElementById('file-bar');
    bar.style.display = 'flex';
    
    for (let f of files) {
      attachedFiles.push(f);
      const pill = document.createElement('div');
      pill.className = 'file-pill';
      pill.innerHTML = `<i class="fa-solid fa-file"></i> ${f.name} <button onclick="this.parentElement.remove()"><i class="fa-solid fa-xmark"></i></button>`;
      bar.appendChild(pill);
      
      // Extract Text Immediately for AI Context
      if (f.type === "application/pdf") {
        extractedFileContext += `\n[FILE: ${f.name}]\n` + await extractPDFText(f);
      } else if (f.name.endsWith(".docx")) {
        extractedFileContext += `\n[FILE: ${f.name}]\n` + await extractDOCXText(f);
      } else if (f.type.startsWith("text/")) {
        const text = await f.text();
        extractedFileContext += `\n[FILE: ${f.name}]\n${text}`;
      } else if (f.type.startsWith("image/")) {
        extractedFileContext += `\n[FILE: ${f.name} (Image attached for reference)]\n`;
      }
    }
  };

  async function extractPDFText(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
    let fullText = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += content.items.map(item => item.str).join(' ') + "\n";
    }
    return fullText;
  }

  async function extractDOCXText(file) {
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({arrayBuffer: arrayBuffer});
    return result.value;
  }

  // --- UI HELPERS ---
  const vp = document.getElementById('chat-vp');
  function scrollToBottom() { setTimeout(() => vp.scrollTop = vp.scrollHeight, 100); }

  function appendUserMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg-group usr';
    div.innerHTML = `<div class="bubble">${text.replace(/\n/g, '<br>')}</div>`;
    vp.appendChild(div);
    scrollToBottom();
  }

  // --- MESSAGE SENDING & STREAMING ---
  window.sendMessage = async () => {
    const input = document.getElementById('prompt-input');
    const text = input.value.trim();
    if (!text && !attachedFiles.length) return;
    
    input.value = '';
    input.style.height = '45px';
    document.getElementById('file-bar').innerHTML = '';
    document.getElementById('file-bar').style.display = 'none';
    
    appendUserMessage(text);
    
    let combinedPrompt = text;
    if (extractedFileContext) {
      combinedPrompt += `\n\n[USER ATTACHED DOCUMENTS CONTEXT]:\n${extractedFileContext}\n\n[INSTRUCTION]: Apply your commands to the text above based on the user's prompt.`;
    }

    chatHistory.push({ role: "user", content: combinedPrompt });
    extractedFileContext = "";
    attachedFiles = [];

    const aiDiv = document.createElement('div');
    aiDiv.className = 'msg-group ai';
    aiDiv.innerHTML = `<div class="bubble"><span id="think-box-${Date.now()}"></span><div class="content"><i class="fa-solid fa-circle-notch fa-spin" style="color:var(--accent)"></i> Executing...</div></div>`;
    vp.appendChild(aiDiv);
    scrollToBottom();

    const contentBox = aiDiv.querySelector('.content');
    const thinkBox = aiDiv.querySelector('span');

    try {
      const token = await currentUser.getIdToken();
      
      const systemPrompt = `
You are Kola the Computer 💻⚡, an autonomous megaton agent of Elvion AI.
Memory: ${userMemory}

YOUR POWERS (MAGIC COMMANDS):
If the user asks you to generate a document, image, or video, you MUST output a hidden XML command in your response. The frontend will intercept it and execute it. 

COMMAND SYNTAX (Output exactly like this within your text):

1. TO CREATE A WORD DOCX (e.g. format to Times New Roman, save as DOCX):
<kola_cmd type="docx" filename="document.docx">
<html_content>
<div style="font-family: 'Times New Roman', serif; text-align: justify;">
<h1>Header</h1>
<p>Content goes here...</p>
</div>
</html_content>
</kola_cmd>

2. TO CREATE A PDF:
<kola_cmd type="pdf" filename="document.pdf">
<html_content>
<div style="font-family: Arial, sans-serif;">Content...</div>
</html_content>
</kola_cmd>

3. TO GENERATE AN IMAGE (e.g. from an article):
<kola_cmd type="image" prompt="Detailed image description based on article..." style="v6"></kola_cmd>

4. TO GENERATE A SLIDESHOW/VIDEO:
<kola_cmd type="video" prompt="Cinematic video description..."></kola_cmd>

RULES:
- Think step-by-step using your standard Anthropic <think> tags.
- For docs, format the <html_content> gorgeously. Use inline CSS for fonts (Times New Roman, Arial), text-align (justify, left), etc.
- Always include the command if they ask for a file, picture, or video.
- Be super intelligent and autonomous.
`;

      const response = await fetch(`${API_URL}/api/minimax/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Firebase-Token': token },
        body: JSON.stringify({
          message: combinedPrompt,
          history: chatHistory.slice(0, -1),
          system_prompt: systemPrompt
        })
      });

      if (!response.ok) throw new Error("Connection failed or Insufficient Credits.");

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullText = "";
      let thinkingText = "";

      contentBox.innerHTML = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value, { stream: true });
        
        const lines = chunk.split('\n\n');
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const dataStr = line.slice(6).trim();
            if (dataStr === '[DONE]') break;
            try {
              const d = JSON.parse(dataStr);
              if (d.type === 'thinking') {
                thinkingText += d.content;
                thinkBox.innerHTML = `<details class="think-block" open><summary class="think-toggle"><i class="fa-solid fa-microchip"></i> Processing Data</summary><div class="think-content">${thinkingText}</div></details>`;
              } else if (d.type === 'content') {
                fullText += d.content;
                // Temporarily render text without XML commands
                const cleanText = fullText.replace(/<kola_cmd[\s\S]*?<\/kola_cmd>/g, '<i style="color:var(--accent-green)">[Executing Command...]</i>');
                contentBox.innerHTML = marked.parse(cleanText);
              }
              scrollToBottom();
            } catch (e) {}
          }
        }
      }

      // STREAM FINISHED: Parse and Execute Magic Commands
      chatHistory.push({ role: "assistant", content: fullText });
      await executeKolaCommands(fullText, contentBox, token);
      updateWallet();

    } catch (err) {
      contentBox.innerHTML = `<span style="color:var(--danger)">❌ Error: ${err.message}</span>`;
    }
  };

  // --- THE MAGIC ENGINE (COMMAND EXECUTOR) ---
  async function executeKolaCommands(text, uiContainer, token) {
    const cmdRegex = /<kola_cmd\s+type="([^"]+)"([^>]*)>([\s\S]*?)<\/kola_cmd>/g;
    let match;
    let finalHtml = marked.parse(text.replace(cmdRegex, '')); // Strip commands from chat text
    
    // Execute each found command
    while ((match = cmdRegex.exec(text)) !== null) {
      const type = match[1];
      const attrsStr = match[2];
      const innerContent = match[3];

      // Parse Attributes
      const attrRegex = /(\w+)="([^"]+)"/g;
      let attrs = {};
      let aMatch;
      while ((aMatch = attrRegex.exec(attrsStr)) !== null) { attrs[aMatch[1]] = aMatch[2]; }
      
      const filename = attrs.filename || `Kola_Output_${Date.now()}`;

      if (type === 'docx' || type === 'pdf') {
        // Extract HTML content for document
        const htmlMatch = innerContent.match(/<html_content>([\s\S]*?)<\/html_content>/);
        const docHtml = htmlMatch ? htmlMatch[1] : innerContent;
        
        const cardId = `card-${Date.now()}`;
        finalHtml += `
          <div class="magic-card" id="${cardId}">
            <div class="magic-card-info">
              <i class="fa-solid fa-file-${type === 'pdf' ? 'pdf' : 'word'} magic-icon"></i>
              <div>
                <div class="magic-title">${filename}</div>
                <div class="magic-sub">Synthesized by Kola</div>
              </div>
            </div>
            <button class="magic-btn" onclick="downloadDocument('${type}', \`${encodeURIComponent(docHtml)}\`, '${filename}')">Download</button>
          </div>`;
      } 
      
      else if (type === 'image') {
        const prompt = attrs.prompt;
        const style = attrs.style || 'v6';
        finalHtml += `<div class="magic-card"><div class="magic-title"><i class="fa-solid fa-palette"></i> Generating Image: ${prompt}...</div></div>`;
        uiContainer.innerHTML = finalHtml; // Update UI immediately to show progress
        
        try {
          const res = await fetch(`${API_URL}/api/studio/generate-image`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Firebase-Token': token },
            body: JSON.stringify({ prompt, model: style, creative: false })
          });
          const d = await res.json();
          if (res.ok) {
            finalHtml += `<img src="data:image/png;base64,${d.image_b64}" class="ai-media">`;
          }
        } catch(e) { finalHtml += `<p style="color:red">Image generation failed.</p>`; }
      }

      else if (type === 'video') {
        const prompt = attrs.prompt;
        finalHtml += `<div class="magic-card"><div class="magic-title"><i class="fa-solid fa-film"></i> Rendering Video: ${prompt}... (Check Studio for status)</div></div>`;
        try {
          await fetch(`${API_URL}/api/studio/generate-video-from-text`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Firebase-Token': token },
            body: JSON.stringify({ prompt, duration: 6, resolution: "768P" })
          });
        } catch(e) {}
      }
    }
    
    uiContainer.innerHTML = finalHtml;
    scrollToBottom();
  }

  // --- CLIENT-SIDE DOCUMENT SYNTHESIS ---
  window.downloadDocument = (type, encodedHtml, filename) => {
    const htmlStr = decodeURIComponent(encodedHtml);
    
    if (type === 'pdf') {
      const opt = {
        margin: 15,
        filename: filename,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      // Wrap content for PDF styling
      const wrapper = document.createElement('div');
      wrapper.innerHTML = htmlStr;
      html2pdf().set(opt).from(wrapper).save();
    } 
    
    else if (type === 'docx') {
      // Magic HTML-to-Word conversion (Preserves inline CSS perfectly in MS Word)
      const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
      <head><meta charset='utf-8'><title>Export HTML to Word</title></head><body>`;
      const footer = "</body></html>";
      const sourceHTML = header + htmlStr + footer;
      
      const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
      const fileDownload = document.createElement("a");
      document.body.appendChild(fileDownload);
      fileDownload.href = source;
      fileDownload.download = filename;
      fileDownload.click();
      document.body.removeChild(fileDownload);
    }
  };

  // Input auto-resize
  document.getElementById('prompt-input').addEventListener('input', function() {
    this.style.height = '45px';
    this.style.height = (this.scrollHeight) + 'px';
  });
  
  // Enter to send
  document.getElementById('prompt-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

</script>
</body>
